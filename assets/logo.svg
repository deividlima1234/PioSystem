<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 120 120"
     width="512"
     height="512">

  <defs>

    <!-- Fondo -->
    <linearGradient id="bgDark"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#18181C"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>

    <!-- P -->
    <linearGradient id="gradWhite"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8DEE8"/>
    </linearGradient>

    <!-- S -->
    <linearGradient id="gradCrimson"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#FF4D73"/>
      <stop offset="45%" stop-color="#FF174D"/>
      <stop offset="100%" stop-color="#C40032"/>
    </linearGradient>

    <!-- Brillo rojo -->
    <radialGradient id="redGlow">
      <stop offset="0%" stop-color="#FF174D" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#FF174D" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FF174D" stop-opacity="0"/>
    </radialGradient>

    <!-- Sombra suave -->
    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feDropShadow dx="0"
                    dy="3"
                    stdDeviation="4"
                    flood-color="#000000"
                    flood-opacity="0.45"/>
    </filter>

    <!-- Máscara para el entrelazado -->
    <mask id="interlaceMask">

      <rect width="120"
            height="120"
            fill="white"/>

      <!-- Corte limpio -->
      <path d="
        M 80 45
        C 77 39, 71 36, 63 36
        C 54 36, 48 40, 48 47
        C 48 55, 55 58, 65 61
        C 76 64, 82 68, 82 76
        C 82 84, 75 88, 65 88
        C 57 88, 51 85, 47 80
      "
      fill="none"
      stroke="black"
      stroke-width="8"
      stroke-linecap="round"/>

    </mask>

  </defs>


  <!-- ================================= -->
  <!-- FONDO DEL APP ICON -->
  <!-- ================================= -->

  <rect x="5"
        y="5"
        width="110"
        height="110"
        rx="28"
        fill="url(#bgDark)"
        filter="url(#shadow)"/>

  <!-- Borde rojo exterior -->
  <rect x="6"
        y="6"
        width="108"
        height="108"
        rx="27"
        fill="none"
        stroke="#FF174D"
        stroke-width="2"
        stroke-opacity="0.75"/>

  <!-- Borde interior sutil -->
  <rect x="10"
        y="10"
        width="100"
        height="100"
        rx="23"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="0.8"
        stroke-opacity="0.07"/>


  <!-- ================================= -->
  <!-- RESPLANDOR -->
  <!-- ================================= -->

  <circle cx="73"
          cy="61"
          r="38"
          fill="url(#redGlow)"/>


  <!-- ================================= -->
  <!-- PIO SYSTEM — P -->
  <!-- ================================= -->

  <g mask="url(#interlaceMask)">

    <path d="
      M 36 88
      L 36 32
      L 57 32

      C 66 32,
        73 39,
        73 47.5

      C 73 56,
        66 63,
        57 63

      L 36 63
    "
    fill="none"
    stroke="url(#gradWhite)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  </g>


  <!-- ================================= -->
  <!-- S -->
  <!-- ================================= -->

  <path d="
    M 84 45

    C 81 39,
      75 36,
      67 36

    C 58 36,
      52 40,
      52 47

    C 52 54,
      58 58,
      67 61

    C 77 64,
      84 68,
      84 76

    C 84 84,
      77 88,
      67 88

    C 59 88,
      53 85,
      49 80
  "
  fill="none"
  stroke="url(#gradCrimson)"
  stroke-width="13"
  stroke-linecap="round"
  stroke-linejoin="round"/>


  <!-- ================================= -->
  <!-- DETALLE / CHISPA -->
  <!-- ================================= -->

  <path d="
    M 82 27
    L 90 23
    L 87 32
    Z
  "
  fill="#FF174D"/>

  <!-- Pequeño brillo -->
  <circle cx="87"
          cy="27"
          r="1.5"
          fill="#FFFFFF"
          opacity="0.8"/>

</svg>
